<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
        }
        
        .status.live {
            background: #00ff00;
            color: #000;
            font-weight: bold;
        }
        
        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            color: white;
            z-index: 10;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .overlay h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            padding: 25px;
            background: #f7f7f7;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            color: white;
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #ff1744 0%, #ff5252 100%);
            color: white;
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #2979ff 0%, #448aff 100%);
            color: white;
        }
        
        .info {
            padding: 20px 25px;
            background: #fff3cd;
            border-top: 3px solid #ffc107;
            color: #856404;
        }
        
        .info h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .info code {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .error {
            padding: 15px 25px;
            background: #f8d7da;
            color: #721c24;
            border-top: 3px solid #f5c6cb;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Live Stream Monitor</h1>
            <div class="status" id="status">⚫ Offline</div>
        </div>
        
        <div class="video-wrapper">
            <video id="video" controls playsinline></video>
            <div class="overlay" id="overlay">
                <h2>Stream chưa sẵn sàng</h2>
                <p>Nhấn "Start Stream" để bắt đầu</p>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="controls">
            <button class="btn-start" onclick="startStream()" id="btnStart">
                ▶️ Start Stream
            </button>
            <button class="btn-stop" onclick="stopStream()" id="btnStop" disabled>
                ⏹️ Stop Stream
            </button>
            <button class="btn-refresh" onclick="checkStatus()" id="btnRefresh">
                🔄 Refresh Status
            </button>
        </div>
        
        <div class="info">
            <h3>ℹ️ Thông tin:</h3>
            <p>
                Stream URL: <code>http://103.116.104.4:8503/hls/stream.m3u8</code><br>
                Độ trễ: 5-10 giây (buffer để giảm lag)<br>
                Server: <code>103.116.104.4:8503</code>
            </p>
        </div>
    </div>

    <script>
        const API_BASE = 'http://103.116.104.4:8503/api/stream';
        const STREAM_URL = 'http://103.116.104.4:8503/hls/stream.m3u8';
        
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const status = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnRefresh = document.getElementById('btnRefresh');
        
        let hls = null;
        
        // Check status on load
        checkStatus();
        
        // Auto refresh status every 5 seconds
        setInterval(checkStatus, 5000);
        
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                if (data.isStreaming) {
                    status.textContent = '🟢 Live';
                    status.classList.add('live');
                    btnStart.disabled = true;
                    btnStop.disabled = false;
                    
                    // Initialize player if not already playing
                    if (!hls && !video.src) {
                        initPlayer();
                    }
                } else {
                    status.textContent = '⚫ Offline';
                    status.classList.remove('live');
                    btnStart.disabled = false;
                    btnStop.disabled = true;
                    showOverlay('Stream đã dừng', 'Nhấn "Start Stream" để bắt đầu lại');
                }
                
                hideError();
            } catch (error) {
                console.error('Error checking status:', error);
                showError('Không thể kết nối đến server: ' + error.message);
            }
        }
        
        async function startStream() {
            showOverlay('Đang khởi động...', '');
            overlay.innerHTML = '<h2>Đang khởi động stream...</h2><div class="spinner"></div>';
            btnStart.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showOverlay('Đang tải...', '');
                    overlay.innerHTML = '<h2>Đang tải stream...</h2><div class="spinner"></div>';
                    
                    // Wait for segments to be generated
                    setTimeout(() => {
                        initPlayer();
                        checkStatus();
                    }, 4000);
                } else {
                    showError('Không thể khởi động stream: ' + data.message);
                    btnStart.disabled = false;
                }
            } catch (error) {
                console.error('Error starting stream:', error);
                showError('Lỗi kết nối: ' + error.message);
                btnStart.disabled = false;
                showOverlay('Lỗi', 'Không thể khởi động stream');
            }
        }
        
        async function stopStream() {
            btnStop.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/stop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                
                video.pause();
                video.src = '';
                
                showOverlay('Stream đã dừng', 'Nhấn "Start Stream" để bắt đầu lại');
                checkStatus();
            } catch (error) {
                console.error('Error stopping stream:', error);
                showError('Lỗi khi dừng stream: ' + error.message);
                btnStop.disabled = false;
            }
        }
        
        function initPlayer() {
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 90
                });
                
                hls.loadSource(STREAM_URL);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('✅ HLS manifest loaded');
                    video.play().then(() => {
                        hideOverlay();
                    }).catch(err => {
                        console.error('Auto-play failed:', err);
                        showOverlay('Click để play', 'Click vào video để bắt đầu phát');
                        video.addEventListener('click', () => {
                            video.play();
                            hideOverlay();
                        }, { once: true });
                    });
                });
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS error:', data);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error('Network error, trying to recover...');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error('Media error, trying to recover...');
                                hls.recoverMediaError();
                                break;
                            default:
                                showError('Lỗi phát stream không thể khôi phục');
                                hls.destroy();
                                hls = null;
                                break;
                        }
                    }
                });
                
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari, iOS)
                video.src = STREAM_URL;
                video.addEventListener('loadedmetadata', () => {
                    video.play().then(() => {
                        hideOverlay();
                    });
                });
            } else {
                showError('Trình duyệt không hỗ trợ HLS. Vui lòng dùng Chrome, Firefox, hoặc Safari.');
            }
        }
        
        function showOverlay(title, message) {
            overlay.innerHTML = `<h2>${title}</h2><p>${message}</p>`;
            overlay.classList.remove('hidden');
        }
        
        function hideOverlay() {
            overlay.classList.add('hidden');
        }
        
        function showError(message) {
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('show');
        }
        
        function hideError() {
            errorDiv.classList.remove('show');
        }
    </script>
</body>
</html>
